name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  families:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Learn each family, apply to its tests, prove
        run: ./run_families.sh
      - name: Every test must equal the axioms and be proved
        run: ./check_results.sh
      - name: Check the worked calculations in the report
        run: swipl calc/calc_check.pl
      - name: proof/types tests
        run: cd prolog && swipl -q -g main -t 'halt(1)' types_tests.pl
