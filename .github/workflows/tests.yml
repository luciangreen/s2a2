name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  families:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Learn each family, apply to its tests, prove
        run: ./run_families.sh
      - name: Every test must equal the axioms and be proved
        run: ./check_results.sh
      - name: Check the worked calculations in the report
        run: swipl calc/calc_check.pl
      - name: proof/types tests
        run: cd prolog && swipl -q -g main -t 'halt(1)' types_tests.pl
      - name: fold tests (side conditions of unfold, fold, lemmas, totality)
        run: cd prolog && swipl -q -g main -t 'halt(1)' fold_tests.pl
      - name: io_synth tests (nested predicates from input/output)
        run: cd prolog && swipl -q -g main -t 'halt(1)' io_synth_tests.pl
      - name: io_synth examples (each checked against a reference predicate)
        run: cd prolog && swipl -q -g main -t 'halt(1)' io_synth_examples.pl > /dev/null
      - name: Dictionary generator (lemma provers, inventors, joiners); the committed output must not change
        run: |
          cd prolog && swipl dict_gen.pl
          git diff --exit-code ../dictionary/generated.pl ../results/dictionary.txt
      - name: Dictionary tests (synthesis from input/output or code)
        run: cd prolog && swipl -q -g main -t 'halt(1)' dict_tests.pl
      - name: Web app predicates (time limits as inference limits, as in the browser)
        run: cd prolog && S2A2_WEB_SHIM=1 swipl -q -g main -t 'halt(1)' web_tests.pl
      - name: Spec to algorithm examples, and the committed results must not change
        run: |
          cd prolog && swipl -q -g main -t 'halt(1)' fold_examples.pl > /dev/null
          git diff --exit-code ../results/fold.txt
